<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stargazers Log</title>
    <meta
      name="description"
      content="A simple log of repositories I've starred."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GitHub activity</p>
          <h1>Stargazers Log</h1>
        </div>
        <button class="primary-btn" id="open-add-modal" type="button">+ Add repo</button>
      </header>

      <main class="content">
        <section class="hero card">
          <div class="hero-copy">
            <p class="tag">Curated list</p>
            <h2>A log of the repositories I’ve starred.</h2>
            <p>
              Keep track of projects worth revisiting, learning from, and
              experimenting with.
            </p>
          </div>
          <div class="stats" aria-label="Starred repositories summary">
            <div class="stat-box">
              <span class="stat-value" id="repo-count">0</span>
              <span class="stat-label">Repos</span>
            </div>
            <div class="stat-box">
              <span class="stat-value" id="language-count">0</span>
              <span class="stat-label">Languages</span>
            </div>
            <div class="stat-box">
              <span class="stat-value" id="year-label">2026</span>
              <span class="stat-label">Year</span>
            </div>
          </div>
        </section>

        <section class="toolbar card">
          <div class="toolbar-row">
            <label class="search-wrap" for="repo-search">
              <span class="sr-only">Search repositories</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M10.5 3a7.5 7.5 0 015.94 12.56l4.39 4.39 1.41-1.41-4.39-4.39A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 104.2 9.4 5.5 5.5 0 00-4.2-9.4z"
                />
              </svg>
              <input
                id="repo-search"
                type="search"
                placeholder="Search repositories..."
                aria-label="Search repositories"
              />
            </label>

            <div class="toolbar-actions">
              <label class="username-field" for="github-username">
                <span>GitHub user</span>
                <input id="github-username" type="text" value="anzedHLB" />
              </label>
              <button class="secondary-btn" id="refresh-repos" type="button">Refresh</button>
            </div>
          </div>

          <div class="toolbar-row secondary-row">
            <div class="sort-group" aria-label="Sorting options">
              <span class="sort-label">Sort</span>
              <select id="sort-select">
                <option value="date-desc">Date: newest</option>
                <option value="date-asc">Date: oldest</option>
                <option value="name-asc">Name: A-Z</option>
                <option value="name-desc">Name: Z-A</option>
                <option value="language-asc">Language: A-Z</option>
              </select>
            </div>

            <div class="tag-group" aria-label="Filter by tag">
              <span class="sort-label">Tag</span>
              <select id="tag-filter">
                <option value="all">All</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="learning">Learning</option>
                <option value="tools">Tools</option>
                <option value="database">Database</option>
              </select>
            </div>
          </div>
        </section>

        <section class="list-header">
          <h3>Starred repositories</h3>
          <span id="results-label">0 results</span>
        </section>

        <div id="status-message" class="status-message" aria-live="polite"></div>

        <section id="repo-list" class="repo-list" aria-live="polite"></section>
      </main>
    </div>

    <div class="modal hidden" id="add-repo-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h3 id="modal-title">Add repository</h3>
          <button class="close-btn" id="close-add-modal" type="button" aria-label="Close">×</button>
        </div>

        <form id="repo-form">
          <div class="form-grid">
            <label>
              <span>Owner</span>
              <input type="text" name="owner" placeholder="microsoft" required />
            </label>
            <label>
              <span>Repository</span>
              <input type="text" name="name" placeholder="vscode" required />
            </label>
            <label class="full-width">
              <span>Description</span>
              <textarea name="description" rows="3" placeholder="Short description..."></textarea>
            </label>
            <label>
              <span>Language</span>
              <input type="text" name="language" placeholder="TypeScript" />
            </label>
            <label>
              <span>Date</span>
              <input type="date" name="date" />
            </label>
            <label class="full-width">
              <span>Category</span>
              <select name="tag">
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="learning">Learning</option>
                <option value="tools">Tools</option>
                <option value="database">Database</option>
              </select>
            </label>
          </div>

          <div class="modal-actions">
            <button class="secondary-btn" type="button" id="cancel-add-repo">Cancel</button>
            <button class="primary-btn" type="submit">Save repo</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal hidden" id="edit-repo-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-header">
          <h3 id="edit-modal-title">Edit repository</h3>
          <button class="close-btn" id="close-edit-modal" type="button" aria-label="Close">×</button>
        </div>

        <form id="edit-repo-form">
          <input type="hidden" name="repoKey" />

          <div class="form-grid">
            <label>
              <span>Owner</span>
              <input type="text" name="owner" required />
            </label>
            <label>
              <span>Repository</span>
              <input type="text" name="name" required />
            </label>
            <label class="full-width">
              <span>Description</span>
              <textarea name="description" rows="3"></textarea>
            </label>
            <label>
              <span>Language</span>
              <input type="text" name="language" />
            </label>
            <label>
              <span>Date</span>
              <input type="date" name="date" />
            </label>
            <label class="full-width">
              <span>Category</span>
              <select name="tag">
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="learning">Learning</option>
                <option value="tools">Tools</option>
                <option value="database">Database</option>
              </select>
            </label>
          </div>

          <div class="modal-actions">
            <button class="secondary-btn" type="button" id="cancel-edit-repo">Cancel</button>
            <button class="primary-btn" type="submit">Update repo</button>
          </div>
        </form>
      </div>
    </div>

    <template id="repo-card-template">
      <article class="repo-card card">
        <div class="repo-topline">
          <div>
            <p class="repo-owner"></p>
            <h4 class="repo-name"></h4>
          </div>
          <span class="star-badge">★</span>
        </div>

        <p class="repo-description"></p>

        <div class="repo-meta">
          <span class="language-pill">
            <span class="language-dot"></span>
            <span class="language-name"></span>
          </span>
          <span class="repo-tag"></span>
          <span class="repo-date"></span>
        </div>

        <div class="repo-footer">
          <div class="repo-stats">
            <span class="repo-stat">★ <strong class="repo-stars">0</strong></span>
            <span class="repo-stat">⎇ <strong class="repo-forks">0</strong></span>
            <span class="repo-stat">● <strong class="repo-issues">0</strong></span>
          </div>
          <div class="repo-actions">
            <a class="repo-link" href="#" target="_blank" rel="noreferrer">Open repo</a>
            <button class="mini-btn edit-btn" type="button">Edit</button>
            <button class="mini-btn delete-btn" type="button">Delete</button>
          </div>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
